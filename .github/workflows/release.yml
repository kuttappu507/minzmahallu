# =============================================================================
# MMS — Release on Tag
# =============================================================================
# This workflow is triggered when a tag matching `v*` is pushed.
# It re-uses the build job, then publishes a GitHub Release with the
# portable zip attached.
#
# To create a release locally:
#   git tag v1.0.0
#   git push origin v1.0.0
# =============================================================================
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build for Release
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
