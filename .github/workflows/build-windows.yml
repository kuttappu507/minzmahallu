# =============================================================================
# MMS — Windows Build (Native MSVC)
# =============================================================================
# Builds MMS.exe natively on GitHub's windows-latest runner using MSVC 2022.
# No cross-compilation, no MinGW version mismatches, no AUTOMOC workarounds.
#
# Triggers:
#   - Every push to main/master
#   - Every PR to main/master
#   - Every v* tag (creates a GitHub Release)
#   - Manual via workflow_dispatch
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS.exe (Windows x64, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Set OpenSSL path
        shell: pwsh
        run: |
          $opensslRoot = "${{ runner.workspace }}\Qt\Tools\OpenSSLv3\Win_x64"
          Write-Host "OpenSSL root: $opensslRoot"
          if (Test-Path "$opensslRoot\include\openssl\evp.h") {
            Write-Host "OpenSSL found"
          } else {
            Write-Host "ERROR: OpenSSL not found"
            exit 1
          }
          echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslRoot\include" >> $env:GITHUB_ENV

      - name: Install zlib via vcpkg (pre-built, fast)
        shell: pwsh
        run: |
          # vcpkg is pre-installed on windows-latest at C:\vcpkg
          & "C:\vcpkg\vcpkg.exe" install zlib:x64-windows
          # Verify it installed
          $zlibLib = "C:\vcpkg\installed\x64-windows\lib"
          Get-ChildItem $zlibLib -Filter zlib* | Select-Object Name
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DOPENSSL_ROOT_DIR=%OPENSSL_ROOT_DIR% ^
            -DOPENSSL_INCLUDE_DIR=%OPENSSL_INCLUDE_DIR% ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build MMS.exe
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4

      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-final | Out-Null

          # 1. MMS.exe
          Copy-Item build/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist-final/MMS.exe)) {
            Copy-Item build/Release/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          }

          # 2. Qt DLLs + plugins via windeployqt (--no-crt = don't copy MSVC runtime)
          & "${env:RUNNER_WORKSPACE}\Qt\${env:QT_VERSION}\msvc2022_64\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-crt `
            "dist-final\MMS.exe"

          # 3. OpenSSL DLLs
          $openSSLBin = "${{ env.OPENSSL_ROOT_DIR }}\bin"
          Get-ChildItem $openSSLBin -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName dist-final\ -Force
          }

          # 4. zlib DLL from vcpkg (x64 only)
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          Get-ChildItem $vcpkgBin -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName dist-final\ -Force
          }

          # 5. Download the OFFICIAL VC++ Redistributable installer from Microsoft
          # (NOT from the runner's redist folder which may have ARM64 DLLs)
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile dist-final\vc_redist.x64.exe -UseBasicParsing

          # 6. App data
          Copy-Item sql dist-final\ -Recurse
          New-Item -ItemType Directory -Force -Path dist-final\resources | Out-Null
          Copy-Item resources\* dist-final\resources\ -Recurse

          # 7. run_mms.bat — installs redist silently, then launches MMS.exe
          @"
          @echo off
          cd /d "%~dp0"
          if exist vc_redist.x64.exe (
            vc_redist.x64.exe /install /quiet /norestart 2>nul
          )
          start "" MMS.exe
          "@ | Out-File -FilePath dist-final\run_mms.bat -Encoding ASCII
          "portable" | Out-File -FilePath dist-final\mms.portable -Encoding ASCII

          # 8. Zip it
          Compress-Archive -Path dist-final\* -DestinationPath MMS-portable-windows-x64.zip -Force
          Write-Host "Zip created: $((Get-Item MMS-portable-windows-x64.zip).Length) bytes"
      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path build\Release\MMS.exe) {
            $f = Get-Item build\Release\MMS.exe
          } else {
            $f = Get-Item build\MMS.exe
          }
          Write-Host "MMS.exe size: $($f.Length) bytes ($([math]::Round($f.Length/1MB, 2)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0

      - name: Upload MMS.exe only
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: |
            build/Release/MMS.exe
            build/MMS.exe
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
