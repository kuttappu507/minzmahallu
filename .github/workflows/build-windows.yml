# =============================================================================
# MMS — Windows Build via Cross-Compilation
# =============================================================================
# This workflow builds MMS.exe on every push/PR by cross-compiling from
# Ubuntu to Windows using MinGW-w64 + Qt 6.8.0 (mingw_64) + OpenSSL.
#
# The resulting portable distribution (MMS.exe + Qt DLLs + SQL + resources)
# is uploaded as a GitHub Actions artifact that anyone with the link can
# download. Tag pushes also create a GitHub Release with the binary attached.
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'
  MINGW_ARCH: 'win64_mingw'

jobs:
  build:
    name: Build MMS.exe (Windows x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            libz-mingw-w64-dev \
            cmake \
            ninja-build \
            python3 \
            pipx \
            ca-certificates
          # aqtinstall for installing Qt binaries — must be recent (>=3.2) to
          # handle the current Qt download XML format.
          pipx install "aqtinstall>=3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt (Win target 6.8.0 + Linux host 6.5.0 for moc/rcc)
        run: |
          mkdir -p /opt/Qt
          # Install the Win Qt 6.8.0 (mingw_64) — needed for headers + libs to link against.
          # qtcharts is an add-on module (NOT bundled by default in mingw_64).
          # qtsvg and qtprintsupport ARE bundled by default, so don't request them.
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.MINGW_ARCH }} \
            --outputdir /opt/Qt \
            --modules qtcharts
          # Install Linux Qt 6.5.0 (gcc_64) for the host moc/rcc tools ONLY.
          # We use 6.5.0 here because aqtinstall 3.3.0 cannot parse the package
          # metadata format introduced in Qt 6.7+ for Linux desktop. moc/rcc are
          # ABI-stable across Qt 6.x, so this is safe — the generated moc_*.cpp and
          # qrc_*.cpp files compile fine against Qt 6.8.0 headers.
          aqt install-qt linux desktop 6.5.0 gcc_64 \
            --outputdir /opt/Qt
          # Make /opt/Qt/6.5.0/gcc_64 appear as /opt/Qt/6.8.0/gcc_64 so the
          # downstream symlink step (which references ${{ env.QT_VERSION }}) works.
          ln -sfn /opt/Qt/6.5.0/gcc_64 /opt/Qt/6.8.0/gcc_64
          # aqtinstall leaves the bin/moc + bin/rcc symlinks pointing at absolute
          # paths that don't exist when installed to a non-standard location. Fix
          # them by recreating as relative symlinks pointing at ../libexec/<tool>.
          for tool in moc rcc uic; do
            ln -sfn "../libexec/$tool" "/opt/Qt/6.5.0/gcc_64/bin/$tool"
          done
          # List what we got
          ls /opt/Qt/6.8.0
          # Verify the Linux moc binary is there
          ls -la /opt/Qt/6.8.0/gcc_64/bin/moc
          /opt/Qt/6.8.0/gcc_64/bin/moc --version
          # Verify the Win Qt6Core lib is there
          ls /opt/Qt/6.8.0/mingw_64/lib/libQt6Core.a

      - name: Install OpenSSL + zlib for MinGW (from MSYS2)
        run: |
          # Fetch the latest mingw-w64 OpenSSL + zlib from MSYS2 (always picks the
          # newest version available, so we don't break when old versions are removed).
          mkdir -p /opt/openssl-win /tmp/msys-pkgs
          cd /tmp/msys-pkgs
          # Discover the latest available version
          OPENSSL_PKG=$(curl -sS https://repo.msys2.org/mingw/mingw64/ | \
            grep -oE 'mingw-w64-x86_64-openssl-[0-9.]+-[0-9]+-any\.pkg\.tar\.zst' | \
            sort -V | tail -1)
          ZLIB_PKG=$(curl -sS https://repo.msys2.org/mingw/mingw64/ | \
            grep -oE 'mingw-w64-x86_64-zlib-[0-9.]+-[0-9]+-any\.pkg\.tar\.zst' | \
            sort -V | tail -1)
          echo "Downloading: $OPENSSL_PKG"
          echo "Downloading: $ZLIB_PKG"
          wget -q "https://repo.msys2.org/mingw/mingw64/$OPENSSL_PKG"
          wget -q "https://repo.msys2.org/mingw/mingw64/$ZLIB_PKG"
          # Extract using zstd + tar
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p /tmp/msys-extract
          for f in *.pkg.tar.zst; do
            zstd -d "$f" -o "${f%.zst}" --force
            tar -xf "${f%.zst}" -C /tmp/msys-extract
          done
          # Stage into /opt/openssl-win/mingw64
          mkdir -p /opt/openssl-win/mingw64
          cp -r /tmp/msys-extract/mingw64/* /opt/openssl-win/mingw64/
          ls /opt/openssl-win/mingw64/lib | head -5
          ls /opt/openssl-win/mingw64/include/openssl | head -5

      - name: Setup symlinks (match toolchain paths)
        run: |
          # The toolchain-mingw.cmake expects:
          #   /home/z/Qt-win/6.8.0/mingw_64    -> /opt/Qt (Win Qt)
          #   /home/z/Qt-linux/6.8.0/gcc_64   -> /opt/Qt (Linux Qt, used for moc/rcc)
          #   /home/z/mingw/usr/bin/...        -> /usr/bin/... (apt-installed mingw-w64)
          #   /home/z/mingw/usr/x86_64-w64-mingw32/ -> /usr/x86_64-w64-mingw32/
          #   /home/z/openssl-win/mingw64      -> /opt/openssl-win
          sudo mkdir -p /home/z
          sudo ln -sfn /opt/Qt /home/z/Qt-win
          sudo ln -sfn /opt/Qt /home/z/Qt-linux
          # Link /home/z/mingw/usr -> /usr so /home/z/mingw/usr/bin -> /usr/bin
          # (NOT /home/z/mingw -> /usr, which would break the path)
          sudo mkdir -p /home/z/mingw
          sudo ln -sfn /usr /home/z/mingw/usr
          sudo ln -sfn /opt/openssl-win /home/z/openssl-win
          # Verify all paths resolve
          ls /home/z/Qt-win/6.8.0/mingw_64/lib/cmake/Qt6/ | head -3
          ls -la /home/z/mingw/usr/bin/x86_64-w64-mingw32-g++
          /home/z/mingw/usr/bin/x86_64-w64-mingw32-g++ --version | head -1
          ls /home/z/openssl-win/mingw64/include/openssl/evp.h

      - name: Configure CMake
        run: |
          export PATH="/home/z/Qt-linux/6.8.0/gcc_64/bin:/home/z/cmake/bin:$PATH"
          export LD_LIBRARY_PATH="/home/z/cmake/libs:/home/z/mingw/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"

      - name: Build MMS.exe (manual moc/rcc + cross-compile)
        run: |
          chmod +x build-scripts/ci-build.sh
          ./build-scripts/ci-build.sh

      - name: Stage distribution
        run: |
          mkdir -p dist-final
          cp build-win/MMS.exe dist-final/
          # Copy Qt DLLs (runtime)
          cp /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Core.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Gui.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Widgets.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Sql.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Charts.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6PrintSupport.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Svg.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6Network.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6OpenGL.dll \
             /home/z/Qt-win/6.8.0/mingw_64/bin/Qt6OpenGLWidgets.dll \
             dist-final/
          # Copy OpenSSL + zlib + mingw runtime DLLs
          cp /opt/openssl-win/mingw64/bin/libcrypto-3-x64.dll \
             /opt/openssl-win/mingw64/bin/libssl-3-x64.dll \
             dist-final/
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll dist-final/ 2>/dev/null || true
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libstdc++-6.dll dist-final/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll dist-final/ 2>/dev/null || true
          cp /opt/openssl-win/mingw64/bin/zlib1.dll dist-final/ 2>/dev/null || true
          # Qt plugins (platforms, styles, sqldrivers)
          mkdir -p dist-final/plugins/platforms dist-final/plugins/styles dist-final/plugins/sqldrivers
          cp /home/z/Qt-win/6.8.0/mingw_64/plugins/platforms/qwindows.dll dist-final/plugins/platforms/
          cp /home/z/Qt-win/6.8.0/mingw_64/plugins/styles/qwindowsvistastyle.dll dist-final/plugins/styles/ 2>/dev/null || true
          cp /home/z/Qt-win/6.8.0/mingw_64/plugins/sqldrivers/qsqlite.dll dist-final/plugins/sqldrivers/
          # App data
          cp -r sql dist-final/
          mkdir -p dist-final/resources
          cp -r resources/* dist-final/resources/
          # Create run batch file
          cat > dist-final/run_mms.bat << 'BAT'
          @echo off
          cd /d "%~dp0"
          start "" MMS.exe
          BAT
          # Marker file
          echo "portable" > dist-final/mms.portable
          # Zip it
          cd dist-final
          zip -r ../MMS-portable-windows-x64.zip .
          cd ..
          ls -lh MMS-portable-windows-x64.zip

      - name: Verify build
        run: |
          file build-win/MMS.exe
          ls -lh build-win/MMS.exe
          # Quick sanity check that the QSS is embedded
          strings build-win/MMS.exe | grep -c "cssClass\|loginCard\|sidebarNav" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0  # already zipped

      - name: Upload MMS.exe only (smaller, faster download)
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: build-win/MMS.exe
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
