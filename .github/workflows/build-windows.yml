name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Install zlib
        shell: pwsh
        run: vcpkg install zlib:x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DOPENSSL_ROOT_DIR=%RUNNER_WORKSPACE%/Qt/Tools/OpenSSLv3/Win_x64" "-DOPENSSL_INCLUDE_DIR=%RUNNER_WORKSPACE%/Qt/Tools/OpenSSLv3/Win_x64/include" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Deploy
        shell: pwsh
        run: |
          mkdir dist -Force
          Copy-Item build/MMS.exe dist/
          & "$env:RUNNER_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "dist/MMS.exe"
          Copy-Item "$env:RUNNER_WORKSPACE/Qt/Tools/OpenSSLv3/Win_x64/bin/libcrypto-3-x64.dll" dist/
          Copy-Item "$env:RUNNER_WORKSPACE/Qt/Tools/OpenSSLv3/Win_x64/bin/libssl-3-x64.dll" dist/
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/z.dll" dist/
          
          # Copy MSVC Runtime DLLs (msvcp140.dll, vcruntime140.dll, vcruntime140_1.dll)
          # Without these, the app silently fails to launch on machines without VS installed
          # Search the entire VS install for the CRT DLLs
          $msvcDll = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "CRT" } | Select-Object -First 1
          if ($msvcDll) {
            $crtDir = $msvcDll.DirectoryName
            Write-Host "Copying MSVC CRT from: $crtDir"
            Copy-Item "$crtDir\*.dll" dist/ -Force
            Get-ChildItem "dist/msvcp*.dll", "dist/vcruntime*.dll" | ForEach-Object { Write-Host "  Copied: $($_.Name)" }
          } else {
            Write-Host "WARNING: MSVC CRT not found! Downloading from Microsoft..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile dist/vc_redist.x64.exe -UseBasicParsing
          }
          
          # Include the VC++ Redistributable installer
          $redistExe = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "vc_redist.x64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($redistExe) {
            Copy-Item $redistExe.FullName dist/ -Force
            Write-Host "Included vc_redist.x64.exe"
          } else {
            if (-not (Test-Path dist/vc_redist.x64.exe)) {
              Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile dist/vc_redist.x64.exe -UseBasicParsing
              Write-Host "Downloaded vc_redist.x64.exe from Microsoft"
            }
          }
          
          Copy-Item sql dist/ -Recurse
          mkdir dist/resources -Force
          Copy-Item resources/* dist/resources/ -Recurse
          @"
          @echo off
          cd /d "%~dp0"
          echo Starting MMS...
          echo.
          MMS.exe
          echo.
          echo MMS.exe exited with code %errorlevel%
          echo.
          if exist mms_error.log (
            echo === mms_error.log contents ===
            type mms_error.log
            echo.
            echo === End of log ===
          )
          echo.
          echo Press any key to close...
          pause >nul
          "@ | Out-File dist/run_mms.bat -Encoding ASCII
          Compress-Archive dist/* MMS-portable.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable
          path: MMS-portable.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MMS-portable
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MMS-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
