name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Install zlib
        shell: pwsh
        run: vcpkg install zlib:x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DOPENSSL_ROOT_DIR=%RUNNER_WORKSPACE%/Qt/Tools/OpenSSLv3/Win_x64" "-DOPENSSL_INCLUDE_DIR=%RUNNER_WORKSPACE%/Qt/Tools/OpenSSLv3/Win_x64/include" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Deploy
        shell: pwsh
        run: |
          mkdir dist -Force
          Copy-Item build/MMS.exe dist/
          & "$env:RUNNER_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --qmldir "$PWD/qml" "dist/MMS.exe"
          Copy-Item "$env:RUNNER_WORKSPACE/Qt/Tools/OpenSSLv3/Win_x64/bin/libcrypto-3-x64.dll" dist/
          Copy-Item "$env:RUNNER_WORKSPACE/Qt/Tools/OpenSSLv3/Win_x64/bin/libssl-3-x64.dll" dist/
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/z.dll" dist/
          
          # Copy MSVC Runtime DLLs (msvcp140.dll, vcruntime140.dll, vcruntime140_1.dll)
          # Without these, the app silently fails to launch on machines without VS installed
          $msvcCrt = Get-ChildItem -Path "$env:VCToolsInstallDir\redist\MSVC" -Recurse -Filter "msvcp140.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if ($msvcCrt) {
            $crtDir = $msvcCrt.DirectoryName
            Write-Host "Copying MSVC CRT from: $crtDir"
            Get-ChildItem "$crtDir\*.dll" | Copy-Item -Destination dist/ -Force
            Write-Host "Copied MSVC runtime DLLs:"
            Get-ChildItem "dist/msvcp*.dll", "dist/vcruntime*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "WARNING: MSVC CRT not found via VCToolsInstallDir, trying VCToolsRedistDir"
            $redistDir = Get-ChildItem "$env:VCToolsRedistDir" -Recurse -Filter "msvcp140.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            if ($redistDir) {
              Get-ChildItem "$($redistDir.DirectoryName)\*.dll" | Copy-Item -Destination dist/ -Force
              Write-Host "Copied MSVC runtime DLLs from VCToolsRedistDir"
            } else {
              Write-Host "ERROR: Could not find MSVC runtime DLLs!"
            }
          }
          
          # Also include the VC++ Redistributable installer
          $redistExe = Get-ChildItem "$env:VCToolsRedistDir" -Filter "vc_redist.x64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($redistExe) {
            Copy-Item $redistExe.FullName dist/ -Force
            Write-Host "Included vc_redist.x64.exe"
          }
          
          Copy-Item sql dist/ -Recurse
          mkdir dist/resources -Force
          Copy-Item resources/* dist/resources/ -Recurse
          mkdir dist/qml -Force
          Copy-Item qml/main.qml dist/qml/
          mkdir dist/qml/components -Force
          Copy-Item qml/components/*.qml dist/qml/components/
          mkdir dist/qml/views -Force
          Copy-Item qml/views/*.qml dist/qml/views/
          @"
          @echo off
          cd /d "%~dp0"
          echo Starting MMS...
          MMS.exe
          if errorlevel 1 (
            echo.
            echo MMS.exe failed (exit code %errorlevel%).
            echo Installing VC++ Redistributable...
            if exist vc_redist.x64.exe (
              vc_redist.x64.exe /install /quiet /norestart
              echo Retrying...
              start "" MMS.exe
            ) else (
              echo Please install Visual C++ Redistributable from Microsoft.
              pause
            )
          )
          "@ | Out-File dist/run_mms.bat -Encoding ASCII
          Compress-Archive dist/* MMS-portable.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable
          path: MMS-portable.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MMS-portable
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MMS-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
