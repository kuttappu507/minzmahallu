# =============================================================================
# MMS — Windows Build (Native MSVC)
# =============================================================================
# Builds MMS.exe natively on GitHub's windows-latest runner using MSVC 2022.
# No cross-compilation, no MinGW version mismatches, no AUTOMOC workarounds.
#
# Triggers:
#   - Every push to main/master
#   - Every PR to main/master
#   - Every v* tag (creates a GitHub Release)
#   - Manual via workflow_dispatch
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS.exe (Windows x64, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Set OpenSSL path
        shell: pwsh
        run: |
          $opensslRoot = "${{ runner.workspace }}\Qt\Tools\OpenSSLv3\Win_x64"
          Write-Host "OpenSSL root: $opensslRoot"
          if (Test-Path "$opensslRoot\include\openssl\evp.h") {
            Write-Host "OpenSSL found"
          } else {
            Write-Host "ERROR: OpenSSL not found"
            exit 1
          }
          echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslRoot\include" >> $env:GITHUB_ENV

      - name: Install zlib (pre-built for MSVC)
        shell: pwsh
        run: |
          # Download pre-built zlib for MSVC from the zlib for Windows project
          $zlibUrl = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib13-dll.zip"
          $zlibZip = "$env:TEMP\zlib.zip"
          $zlibDir = "C:\zlib"
          Invoke-WebRequest -Uri $zlibUrl -OutFile $zlibZip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $zlibDir | Out-Null
          Expand-Archive -Path $zlibZip -DestinationPath $zlibDir -Force
          # The zip has dll/ include/ lib/ — set the env vars
          echo "ZLIB_ROOT=$zlibDir" >> $env:GITHUB_ENV
          echo "ZLIB_INCLUDE_DIR=$zlibDir\include" >> $env:GITHUB_ENV
          echo "ZLIB_LIBRARY=$zlibDir\lib\zlib.lib" >> $env:GITHUB_ENV
          Get-ChildItem $zlibDir -Recurse | Select-Object FullName | Select-Object -First 10

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DOPENSSL_ROOT_DIR=%OPENSSL_ROOT_DIR% ^
            -DOPENSSL_INCLUDE_DIR=%OPENSSL_INCLUDE_DIR% ^
            -DZLIB_ROOT=%ZLIB_ROOT% ^
            -DZLIB_INCLUDE_DIR=%ZLIB_INCLUDE_DIR% ^
            -DZLIB_LIBRARY=%ZLIB_LIBRARY%

      - name: Build MMS.exe
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4

      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-final | Out-Null

          # MMS.exe (built by CMake)
          Copy-Item build/Release/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          Copy-Item build/MMS.exe dist-final/ -ErrorAction SilentlyContinue

          # Qt DLLs (runtime) — windeployqt does this automatically
          # Run windeployqt to copy all required Qt DLLs + plugins
          & "${env:RUNNER_WORKSPACE}\Qt\${env:QT_VERSION}\msvc2022_64\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            "dist-final\MMS.exe"

          # OpenSSL DLLs (from the aqtinstall-fetched Qt tool)
          $openSSLBin = "${{ env.OPENSSL_ROOT_DIR }}\bin"
          if (Test-Path $openSSLBin) {
            Get-ChildItem $openSSLBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName dist-final\ -Force
            }
            Write-Host "Copied OpenSSL DLLs from $openSSLBin"
          } else {
            Write-Host "WARNING: OpenSSL bin not found at $openSSLBin"
            Get-ChildItem ${{ env.OPENSSL_ROOT_DIR }} -Recurse -Filter *.dll | Select-Object FullName
          }

          # App data
          Copy-Item sql dist-final\ -Recurse
          New-Item -ItemType Directory -Force -Path dist-final\resources | Out-Null
          Copy-Item resources\* dist-final\resources\ -Recurse

          # Run batch file
          @"
          @echo off
          cd /d "%~dp0"
          start "" MMS.exe
          "@ | Out-File -FilePath dist-final\run_mms.bat -Encoding ASCII

          # Marker
          "portable" | Out-File -FilePath dist-final\mms.portable -Encoding ASCII

          # Zip it
          Compress-Archive -Path dist-final\* -DestinationPath MMS-portable-windows-x64.zip -Force
          Get-ChildItem MMS-portable-windows-x64.zip | Select-Object Name, Length

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path build\Release\MMS.exe) {
            $f = Get-Item build\Release\MMS.exe
          } else {
            $f = Get-Item build\MMS.exe
          }
          Write-Host "MMS.exe size: $($f.Length) bytes ($([math]::Round($f.Length/1MB, 2)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0

      - name: Upload MMS.exe only
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: |
            build/Release/MMS.exe
            build/MMS.exe
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
