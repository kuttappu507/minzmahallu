# =============================================================================
# MMS — Windows Build (Native MSVC)
# =============================================================================
# Builds MMS.exe natively on GitHub's windows-latest runner using MSVC 2022.
# No cross-compilation, no MinGW version mismatches, no AUTOMOC workarounds.
#
# Triggers:
#   - Every push to main/master
#   - Every PR to main/master
#   - Every v* tag (creates a GitHub Release)
#   - Manual via workflow_dispatch
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS.exe (Windows x64, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          cache: true

      - name: Install pre-built OpenSSL for MSVC
        shell: pwsh
        run: |
          # Download pre-built OpenSSL 3.x for Windows x64 (MSVC build)
          # from the shining-light installer mirror — much faster than vcpkg
          # compiling from source (~30 sec vs ~30 min)
          $url = "https://slproweb.com/download/Wind64OpenSSL-3_0_15.exe"
          $installer = "$env:TEMP\openssl-installer.exe"
          Write-Host "Downloading OpenSSL installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          # Silent install to a known location
          Write-Host "Installing OpenSSL silently..."
          Start-Process -FilePath $installer -ArgumentList "/silent /verysilent /sp- /suppressmsgboxes /norestart /DIR=C:\OpenSSL-Win64" -Wait
          # Verify
          if (Test-Path "C:\OpenSSL-Win64\include\openssl\evp.h") {
            Write-Host "OpenSSL installed successfully"
          } else {
            Write-Host "ERROR: OpenSSL install failed"
            exit 1
          }
          echo "OPENSSL_ROOT_DIR=C:\OpenSSL-Win64" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DOPENSSL_ROOT_DIR=C:\OpenSSL-Win64 ^
            -DOPENSSL_INCLUDE_DIR=C:\OpenSSL-Win64\include ^
            -DOPENSSL_CRYPTO_LIBRARY=C:\OpenSSL-Win64\lib\VC\libcrypto64MD.lib ^
            -DOPENSSL_SSL_LIBRARY=C:\OpenSSL-Win64\lib\VC\libssl64MD.lib

      - name: Build MMS.exe
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4

      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-final | Out-Null

          # MMS.exe (built by CMake)
          Copy-Item build/Release/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          Copy-Item build/MMS.exe dist-final/ -ErrorAction SilentlyContinue

          # Qt DLLs (runtime) — windeployqt does this automatically
          # Run windeployqt to copy all required Qt DLLs + plugins
          & "${env:RUNNER_WORKSPACE}\Qt\${env:QT_VERSION}\msvc2022_64\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            "dist-final\MMS.exe"

          # OpenSSL DLLs (from the pre-built install)
          $openSSLBin = "C:\OpenSSL-Win64\bin"
          if (Test-Path $openSSLBin) {
            Copy-Item "$openSSLBin\libcrypto-3-x64.dll" dist-final\ -Force
            Copy-Item "$openSSLBin\libssl-3-x64.dll" dist-final\ -Force
            Write-Host "Copied OpenSSL DLLs"
          }

          # App data
          Copy-Item sql dist-final\ -Recurse
          New-Item -ItemType Directory -Force -Path dist-final\resources | Out-Null
          Copy-Item resources\* dist-final\resources\ -Recurse

          # Run batch file
          @"
          @echo off
          cd /d "%~dp0"
          start "" MMS.exe
          "@ | Out-File -FilePath dist-final\run_mms.bat -Encoding ASCII

          # Marker
          "portable" | Out-File -FilePath dist-final\mms.portable -Encoding ASCII

          # Zip it
          Compress-Archive -Path dist-final\* -DestinationPath MMS-portable-windows-x64.zip -Force
          Get-ChildItem MMS-portable-windows-x64.zip | Select-Object Name, Length

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path build\Release\MMS.exe) {
            $f = Get-Item build\Release\MMS.exe
          } else {
            $f = Get-Item build\MMS.exe
          }
          Write-Host "MMS.exe size: $($f.Length) bytes ($([math]::Round($f.Length/1MB, 2)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0

      - name: Upload MMS.exe only
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: |
            build/Release/MMS.exe
            build/MMS.exe
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
