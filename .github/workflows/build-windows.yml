# =============================================================================
# MMS — Windows Build (Native MSVC)
# =============================================================================
# Builds MMS.exe natively on GitHub's windows-latest runner using MSVC 2022.
# No cross-compilation, no MinGW version mismatches, no AUTOMOC workarounds.
#
# Triggers:
#   - Every push to main/master
#   - Every PR to main/master
#   - Every v* tag (creates a GitHub Release)
#   - Manual via workflow_dispatch
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS.exe (Windows x64, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Set OpenSSL path
        shell: pwsh
        run: |
          $opensslRoot = "${{ runner.workspace }}\Qt\Tools\OpenSSLv3\Win_x64"
          Write-Host "OpenSSL root: $opensslRoot"
          if (Test-Path "$opensslRoot\include\openssl\evp.h") {
            Write-Host "OpenSSL found"
          } else {
            Write-Host "ERROR: OpenSSL not found"
            exit 1
          }
          echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslRoot\include" >> $env:GITHUB_ENV

      - name: Install zlib via vcpkg (pre-built, fast)
        shell: pwsh
        run: |
          # vcpkg is pre-installed on windows-latest at C:\vcpkg
          & "C:\vcpkg\vcpkg.exe" install zlib:x64-windows
          # Verify it installed
          $zlibLib = "C:\vcpkg\installed\x64-windows\lib"
          Get-ChildItem $zlibLib -Filter zlib* | Select-Object Name
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DOPENSSL_ROOT_DIR=%OPENSSL_ROOT_DIR% ^
            -DOPENSSL_INCLUDE_DIR=%OPENSSL_INCLUDE_DIR% ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build MMS.exe
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4

      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-final | Out-Null

          # MMS.exe (built by CMake)
          Copy-Item build/Release/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          Copy-Item build/MMS.exe dist-final/ -ErrorAction SilentlyContinue

          # Qt DLLs (runtime) — windeployqt does this automatically
          # Run windeployqt to copy all required Qt DLLs + plugins
          & "${env:RUNNER_WORKSPACE}\Qt\${env:QT_VERSION}\msvc2022_64\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            "dist-final\MMS.exe"

          # OpenSSL DLLs (from the Qt-bundled OpenSSL tool)
          $openSSLBin = "${{ env.OPENSSL_ROOT_DIR }}\bin"
          if (Test-Path $openSSLBin) {
            Get-ChildItem $openSSLBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName dist-final\ -Force
            }
            Write-Host "Copied OpenSSL DLLs from $openSSLBin"
          } else {
            Write-Host "WARNING: OpenSSL bin not found at $openSSLBin"
          }

          # zlib1.dll + any other vcpkg runtime DLLs (windeployqt does NOT copy these)
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName dist-final\ -Force
              Write-Host "Copied vcpkg DLL: $($_.Name)"
            }
          } else {
            Write-Host "WARNING: vcpkg bin not found at $vcpkgBin"
          }

          # MSVC runtime DLLs (msvcp140.dll, vcruntime140.dll, vcruntime140_1.dll)
          # These are required because the user may not have MSVC runtime installed.
          # Find them in the MSVC redist folder.
          $redistBase = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          if (Test-Path $redistBase) {
            $crtDir = Get-ChildItem $redistBase -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $crtPath = "$($crtDir.FullName)\x64\Microsoft.VC143.CRT"
            Write-Host "MSVC CRT path: $crtPath"
            if (Test-Path $crtPath) {
              Get-ChildItem $crtPath -Filter *.dll | ForEach-Object {
                Copy-Item $_.FullName dist-final\ -Force
                Write-Host "Copied MSVC runtime DLL: $($_.Name)"
              }
            } else {
              Write-Host "WARNING: MSVC CRT not found at $crtPath"
            }
          } else {
            Write-Host "WARNING: MSVC redist not found — searching for runtime DLLs"
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
          }

          # App data
          Copy-Item sql dist-final\ -Recurse
          New-Item -ItemType Directory -Force -Path dist-final\resources | Out-Null
          Copy-Item resources\* dist-final\resources\ -Recurse

          # Run batch file
          @"
          @echo off
          cd /d "%~dp0"
          start "" MMS.exe
          "@ | Out-File -FilePath dist-final\run_mms.bat -Encoding ASCII

          # Marker
          "portable" | Out-File -FilePath dist-final\mms.portable -Encoding ASCII

          # Zip it
          Compress-Archive -Path dist-final\* -DestinationPath MMS-portable-windows-x64.zip -Force
          Get-ChildItem MMS-portable-windows-x64.zip | Select-Object Name, Length

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path build\Release\MMS.exe) {
            $f = Get-Item build\Release\MMS.exe
          } else {
            $f = Get-Item build\MMS.exe
          }
          Write-Host "MMS.exe size: $($f.Length) bytes ($([math]::Round($f.Length/1MB, 2)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0

      - name: Upload MMS.exe only
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: |
            build/Release/MMS.exe
            build/MMS.exe
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
