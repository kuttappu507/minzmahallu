# =============================================================================
# MMS — Windows Build (Native MSVC)
# =============================================================================
# Builds MMS.exe natively on GitHub's windows-latest runner using MSVC 2022.
# No cross-compilation, no MinGW version mismatches, no AUTOMOC workarounds.
#
# Triggers:
#   - Every push to main/master
#   - Every PR to main/master
#   - Every v* tag (creates a GitHub Release)
#   - Manual via workflow_dispatch
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'

jobs:
  build:
    name: Build MMS.exe (Windows x64, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          cache: true

      - name: Install OpenSSL + zlib via vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ runner.workspace }}\vcpkg"
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=. --x-install-root="${{ runner.workspace }}\vcpkg_installed"
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -S . -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build MMS.exe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel 4

      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-final | Out-Null

          # MMS.exe (built by CMake)
          Copy-Item build/Release/MMS.exe dist-final/ -ErrorAction SilentlyContinue
          Copy-Item build/MMS.exe dist-final/ -ErrorAction SilentlyContinue

          # Qt DLLs (runtime) — windeployqt does this automatically
          # Run windeployqt to copy all required Qt DLLs + plugins
          & "${env:RUNNER_WORKSPACE}\Qt\${env:QT_VERSION}\msvc2022_64\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            "dist-final\MMS.exe"

          # OpenSSL + zlib DLLs (installed by vcpkg, copied next to MMS.exe by windeployqt)
          # windeployqt doesn't handle non-Qt DLLs, so copy them manually from vcpkg bin
          $vcpkgBin = "${{ runner.workspace }}\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName dist-final\ -Force
            }
            Write-Host "Copied OpenSSL + zlib DLLs from vcpkg"
          } else {
            Write-Host "WARNING: vcpkg bin not found at $vcpkgBin"
          }

          # App data
          Copy-Item sql dist-final\ -Recurse
          New-Item -ItemType Directory -Force -Path dist-final\resources | Out-Null
          Copy-Item resources\* dist-final\resources\ -Recurse

          # Run batch file
          @"
          @echo off
          cd /d "%~dp0"
          start "" MMS.exe
          "@ | Out-File -FilePath dist-final\run_mms.bat -Encoding ASCII

          # Marker
          "portable" | Out-File -FilePath dist-final\mms.portable -Encoding ASCII

          # Zip it
          Compress-Archive -Path dist-final\* -DestinationPath MMS-portable-windows-x64.zip -Force
          Get-ChildItem MMS-portable-windows-x64.zip | Select-Object Name, Length

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path build\Release\MMS.exe) {
            $f = Get-Item build\Release\MMS.exe
          } else {
            $f = Get-Item build\MMS.exe
          }
          Write-Host "MMS.exe size: $($f.Length) bytes ($([math]::Round($f.Length/1MB, 2)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: MMS-portable-windows-x64.zip
          retention-days: 90
          compression-level: 0

      - name: Upload MMS.exe only
        uses: actions/upload-artifact@v4
        with:
          name: MMS-exe
          path: |
            build/Release/MMS.exe
            build/MMS.exe
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MMS-portable-windows-x64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/MMS-portable-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
